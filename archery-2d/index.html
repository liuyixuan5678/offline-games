<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');
  :root {
    --gold: #c9a84c; --gold-light: #e8c97a; --bg: #0a0c0e;
    --ui-bg: rgba(10,12,14,0.88);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0c0e; font-family:'Cinzel',serif; user-select:none; }

  #wrap { position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; }

  #title-bar {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 24px; height:44px; flex-shrink:0;
    border-bottom:1px solid rgba(201,168,76,0.3);
    background:var(--ui-bg); backdrop-filter:blur(8px); z-index:5;
  }
  #game-title { font-size:20px; font-weight:900; letter-spacing:.3em; color:var(--gold); text-shadow:0 0 20px rgba(201,168,76,.4); }
  #score-display { font-size:13px; letter-spacing:.15em; color:var(--gold-light); }
  #level-display { font-size:11px; letter-spacing:.2em; color:rgba(201,168,76,.7); }

  #canvas-wrap { position:relative; flex:1; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }

  #hud {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 24px; height:44px; flex-shrink:0;
    background:var(--ui-bg); backdrop-filter:blur(8px);
    border-top:1px solid rgba(201,168,76,.2); z-index:5;
  }
  #power-container { display:flex; align-items:center; gap:10px; }
  #power-label { font-size:10px; letter-spacing:.2em; color:rgba(201,168,76,.6); }
  #power-bar-bg { width:130px; height:6px; background:rgba(255,255,255,.08); border:1px solid rgba(201,168,76,.2); border-radius:3px; overflow:hidden; }
  #power-bar { height:100%; width:0%; background:linear-gradient(90deg,#4a9a4a,#c9a84c,#8b1a1a); border-radius:3px; }
  #arrows-display { font-size:13px; letter-spacing:.1em; color:var(--gold-light); }
  #instructions { font-family:'Crimson Pro',serif; font-size:12px; font-style:italic; color:rgba(201,168,76,.5); }

  /* P2 power bar (right side of hud) */
  #p2-power-container { display:none; align-items:center; gap:10px; }
  #p2-power-label { font-size:10px; letter-spacing:.2em; color:rgba(100,180,255,.6); }
  #p2-power-bar-bg { width:130px; height:6px; background:rgba(255,255,255,.08); border:1px solid rgba(100,180,255,.2); border-radius:3px; overflow:hidden; }
  #p2-power-bar { height:100%; width:0%; background:linear-gradient(90deg,#4a4a9a,#4c9ac9,#1a3a8b); border-radius:3px; }

  #overlay {
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(10,12,14,.93); backdrop-filter:blur(4px); z-index:10;
  }
  #overlay h2 { font-size:42px; font-weight:900; letter-spacing:.3em; color:var(--gold); text-shadow:0 0 40px rgba(201,168,76,.5); margin-bottom:10px; }
  #overlay p { font-family:'Crimson Pro',serif; font-size:16px; font-style:italic; color:rgba(201,168,76,.6); margin-bottom:6px; letter-spacing:.05em; }
  .final-score { font-size:30px; color:var(--gold-light); margin:14px 0; letter-spacing:.2em; }
  .divider { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px 0; }

  .btn {
    margin-top:14px; padding:12px 38px;
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    font-family:'Cinzel',serif; font-size:13px; letter-spacing:.3em;
    cursor:pointer; transition:all .3s; text-transform:uppercase;
  }
  .btn:hover { background:var(--gold); color:var(--bg); box-shadow:0 0 30px rgba(201,168,76,.4); }
  .btn.blue { border-color:#4c9ac9; color:#4c9ac9; }
  .btn.blue:hover { background:#4c9ac9; color:#000; box-shadow:0 0 30px rgba(76,154,201,.4); }

  .mode-btns { display:flex; gap:20px; margin-top:20px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="title-bar">
    <div id="game-title">ARCHER</div>
    <div id="level-display" style="display:none">LEVEL <span id="lvl-num">1</span></div>
    <div id="score-display">SCORE: <span id="score-num">0</span></div>
  </div>

  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="overlay">
      <h2>ARCHER</h2>
      <div class="divider"></div>
      <p>Forest of Trials</p>
      <p style="font-size:13px;margin-top:4px;">Hold mouse to draw bow · Release to fire · W/S to climb</p>
      <div class="mode-btns">
        <button class="btn" id="btn-single">SINGLE PLAYER</button>
        <button class="btn blue" id="btn-two">TWO PLAYERS</button>
      </div>
    </div>
  </div>

  <div id="hud">
    <div id="power-container">
      <div id="power-label">P1 DRAW</div>
      <div id="power-bar-bg"><div id="power-bar"></div></div>
    </div>
    <div id="instructions">W/S climb · Hold+aim+release to shoot</div>
    <div id="arrows-display">🏹 <span id="arrows-left">10</span></div>
    <div id="p2-power-container">
      <div id="p2-power-label">P2 DRAW</div>
      <div id="p2-power-bar-bg"><div id="p2-power-bar"></div></div>
    </div>
  </div>
</div>

<script>
// ─── Canvas resize to fill window ─────────────────────────────
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  W = canvas.width  = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
  // Recalculate derived constants
  recalcLayout();
}
window.addEventListener('resize', resizeCanvas);

// ─── Layout constants (recalc on resize) ──────────────────────
let GROUND_Y, LADDER_TOP, LADDER_BOTTOM;
let ARCHER_X, ARCHER2_X;
const CLIMB_SPEED = 3;
const GRAVITY = 0.2;
const MAX_POWER = 42;
const HOLD_MAX = 1200;
const HITS_TO_LOSE = 5;

function recalcLayout() {
  GROUND_Y = H - 60;
  LADDER_TOP = 8;
  LADDER_BOTTOM = GROUND_Y - 8;
  ARCHER_X  = 80;
  ARCHER2_X = W - 80;
}

// ─── Game State ───────────────────────────────────────────────
const state = {
  mode: 'menu',       // menu | single | two
  phase: 'menu',      // menu | playing | levelclear | gameover
  score: 0, level: 1,
  arrows: 10,
  archerY: 0,
  climbDir: 0,
  holding: false, holdStart: 0, power: 0,
  mouseX: 0, mouseY: 0,
  // P2 (two-player)
  p2Y: 0,
  p2ClimbDir: 0,
  p2Holding: false, p2HoldStart: 0, p2Power: 0,
  p2AimAngle: Math.PI, // starts pointing left (toward P1)
  p2AimDir: 0,         // -1 aim up, 0 still, 1 aim down
  p1Hits: 0, p2Hits: 0,
  // shared
  targets: [],
  obstacles: [],
  arrows_in_flight: [],  // { x,y,vx,vy,owner:'p1'|'p2' }
  particles: [],
  hit_texts: [],
  wind: 0,
  bg_offset: 0,
};

// ─── Background tree data ─────────────────────────────────────
let bgLayers = [];
function initBgLayers() {
  bgLayers = [
    { trees: genTrees(7,  0.15, 180, 220), speed: 0   },
    { trees: genTrees(10, 0.25, 140, 180), speed: 0.1 },
    { trees: genTrees(13, 0.4,  100, 150), speed: 0.2 },
    { trees: genTrees(16, 0.6,  60,  110), speed: 0.35},
  ];
}
function genTrees(count, brightness, minH, maxH) {
  const arr = [];
  for (let i = 0; i < count; i++)
    arr.push({ x: (i/count)*W*1.5 + Math.random()*40, h: minH+Math.random()*(maxH-minH), w: 18+Math.random()*20, b: brightness });
  return arr;
}

// ─── Level config ─────────────────────────────────────────────
function getLevelConfig(lvl) {
  return {
    targetCount: 2 + Math.min(lvl, 6),
    wind: (Math.random()-0.5)*lvl*0.04,
    arrowsGiven: Math.max(6, 10-Math.floor(lvl/2)),
  };
}

// ─── Spawn targets (single player birds) ──────────────────────
function spawnTargets() {
  const cfg = getLevelConfig(state.level);
  state.wind = cfg.wind;
  state.targets = [];
  const count = cfg.targetCount;
  for (let i = 0; i < count; i++) {
    const x = 200 + Math.random()*(W - 300);
    const y = 40  + Math.random()*(GROUND_Y - 120);
    const spd = (0.6+Math.random()*0.8)*(Math.random()<0.5?1:-1);
    state.targets.push({ x, y, r: 22-Math.min(state.level,8), hit:false, vx:spd, vy:0, falling:false, fallVy:0, wingPhase:Math.random()*Math.PI*2 });
  }
}

// ─── DRAW: Background ─────────────────────────────────────────
function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050c14'); sky.addColorStop(0.5,'#0a1520'); sky.addColorStop(1,'#0d1a0d');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

  // Moon
  ctx.save();
  ctx.beginPath(); ctx.arc(W-130, 70, 40, 0, Math.PI*2);
  const mg = ctx.createRadialGradient(W-130,70,4,W-130,70,40);
  mg.addColorStop(0,'rgba(240,230,200,.95)'); mg.addColorStop(1,'rgba(200,190,140,0)');
  ctx.fillStyle=mg; ctx.fill(); ctx.restore();

  // Stars
  ctx.save();
  for (let i=0;i<80;i++){
    const sx=(i*137.5+20)%W, sy=(i*97.3+10)%(H*0.55);
    const sz=0.5+(i%3)*0.5, p=0.4+0.6*Math.abs(Math.sin(Date.now()*.001+i));
    ctx.beginPath(); ctx.arc(sx,sy,sz,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,215,200,${p*.7})`; ctx.fill();
  }
  ctx.restore();

  // Trees
  bgLayers.forEach((layer,li) => {
    const offset = state.bg_offset * layer.speed;
    layer.trees.forEach(tree => {
      const tx=((tree.x-offset)%(W*1.5)+W*1.5)%(W*1.5)-W*0.25;
      const ty=GROUND_Y-tree.h*0.3;
      ctx.save(); ctx.globalAlpha=layer.b;
      const g=li/bgLayers.length, gr=Math.floor(10+g*20);
      ctx.fillStyle=`rgb(${gr},${gr+10},${gr})`;
      for (let p=0;p<3;p++){
        const ph=tree.h*(0.5+p*0.15),pw=tree.w*(1.1-p*0.25),py=ty+tree.h*0.3-p*tree.h*0.25;
        ctx.beginPath(); ctx.moveTo(tx,py-ph); ctx.lineTo(tx-pw/2,py); ctx.lineTo(tx+pw/2,py); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle=`rgb(${gr-5},${gr},${gr-8})`; ctx.fillRect(tx-3,ty+tree.h*0.3,6,20);
      ctx.restore();
    });
  });

  // Ground
  const gg=ctx.createLinearGradient(0,GROUND_Y-10,0,H);
  gg.addColorStop(0,'#1a2e18'); gg.addColorStop(1,'#0a0f0a');
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y-10,W,H-GROUND_Y+10);

  // Grass blades
  ctx.strokeStyle='rgba(40,80,30,.5)'; ctx.lineWidth=1;
  for (let gx=0;gx<W;gx+=8){
    const gh=4+Math.sin(gx*.3)*3;
    ctx.beginPath(); ctx.moveTo(gx,GROUND_Y-10); ctx.lineTo(gx+3,GROUND_Y-10-gh); ctx.stroke();
  }
}

// ─── DRAW: Ladders ────────────────────────────────────────────
function drawLadder(cx, flip) {
  const lx = flip ? cx - 10 : cx - 12;
  const railW = 22, spacing = 18;
  ctx.strokeStyle='#7a5530'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(lx,LADDER_TOP); ctx.lineTo(lx,LADDER_BOTTOM); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx+railW,LADDER_TOP); ctx.lineTo(lx+railW,LADDER_BOTTOM); ctx.stroke();
  ctx.strokeStyle='#a07040'; ctx.lineWidth=3;
  for (let ry=LADDER_BOTTOM; ry>=LADDER_TOP; ry-=spacing){
    ctx.beginPath(); ctx.moveTo(lx+2,ry); ctx.lineTo(lx+railW-2,ry); ctx.stroke();
  }
}

// ─── DRAW: Archer ─────────────────────────────────────────────
function drawArcher(ax, ay, aimAngle, holding, power, flip) {
  ctx.save();
  ctx.translate(ax, ay);
  if (flip) ctx.scale(-1, 1);

  // Cloak
  ctx.fillStyle='#1a0f0a';
  ctx.beginPath();
  ctx.moveTo(-12,-10); ctx.quadraticCurveTo(-5,10,-6,36); ctx.quadraticCurveTo(2,30,4,36); ctx.quadraticCurveTo(8,10,2,-10);
  ctx.fill();

  // Body
  ctx.fillStyle='#2a1a0a';
  ctx.beginPath(); ctx.ellipse(-4,18,8,18,0,0,Math.PI*2); ctx.fill();

  // Head
  ctx.fillStyle='#c8a878';
  ctx.beginPath(); ctx.arc(0,-22,11,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a0f0a';
  ctx.beginPath(); ctx.arc(-1,-23,12,Math.PI,Math.PI*2); ctx.fill();

  // Bow arm — aim relative to flipped space
  const localAngle = flip ? Math.PI - aimAngle : aimAngle;
  ctx.save();
  ctx.translate(4,-8); ctx.rotate(localAngle);
  const bowDraw = holding ? Math.min(power/MAX_POWER,1)*14 : 0;
  ctx.strokeStyle='#8b6914'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,22,-0.9,0.9); ctx.stroke();
  ctx.strokeStyle = holding ? '#e8c97a' : 'rgba(200,180,120,.7)';
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(22*Math.cos(-0.9),22*Math.sin(-0.9));
  ctx.lineTo(-bowDraw,0);
  ctx.lineTo(22*Math.cos(0.9),22*Math.sin(0.9));
  ctx.stroke();
  if (holding && power > 0.5) {
    ctx.strokeStyle='#c8a050'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-bowDraw,0); ctx.lineTo(30,0); ctx.stroke();
    ctx.fillStyle='#a0a0b0';
    ctx.beginPath(); ctx.moveTo(32,0); ctx.lineTo(28,-3); ctx.lineTo(28,3); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

// ─── DRAW: Arrows in flight ────────────────────────────────────
const stuckArrows = [];
function drawStuckArrows() {
  stuckArrows.forEach(a => {
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(a.angle);
    ctx.strokeStyle='#a08030'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-16,0); ctx.lineTo(8,0); ctx.stroke();
    ctx.fillStyle='#909090';
    ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(6,-2.5); ctx.lineTo(6,2.5); ctx.fill();
    ctx.restore();
  });
}
function drawArrows() {
  state.arrows_in_flight.forEach(a => {
    ctx.save(); ctx.translate(a.x,a.y); ctx.rotate(Math.atan2(a.vy,a.vx));
    ctx.strokeStyle = a.owner==='p2' ? '#7090e8' : '#c8a050';
    ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(10,0); ctx.stroke();
    ctx.fillStyle='#a8a8c0';
    ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(8,-3); ctx.lineTo(8,3); ctx.fill();
    ctx.strokeStyle= a.owner==='p2' ? '#1a3a8b' : '#6b1010';
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(-20,-5); ctx.moveTo(-15,0); ctx.lineTo(-20,5); ctx.stroke();
    ctx.restore();
  });
}

// ─── DRAW: Birds ──────────────────────────────────────────────
function drawBird(bx, by, r, wingPhase, falling, dir) {
  ctx.save(); ctx.translate(bx, by);
  if (dir < 0) ctx.scale(-1,1);
  const wing = Math.sin(wingPhase)*0.5;
  ctx.fillStyle='#2a2010';
  ctx.beginPath(); ctx.ellipse(0,0,r*.6,r*.35,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(r*.5,-r*.1,r*.28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8a820';
  ctx.beginPath(); ctx.moveTo(r*.76,-r*.1); ctx.lineTo(r,-.06*r); ctx.lineTo(r*.76,-r*.02); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(r*.58,-r*.17,r*.09,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(r*.6,-r*.17,r*.05,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a3018';
  if (falling) {
    ctx.beginPath(); ctx.ellipse(-r*.1,0,r*.9,r*.2,-0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-r*.55,0); ctx.lineTo(-r*.9,r*.35); ctx.lineTo(-r*.7,0); ctx.fill();
  } else {
    ctx.save(); ctx.translate(-r*.1,-r*.05); ctx.rotate(-0.4-wing);
    ctx.beginPath(); ctx.ellipse(0,-r*.35,r*.25,r*.65,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(-r*.55,0); ctx.lineTo(-r*.95,-r*.15); ctx.lineTo(-r*.85,r*.1); ctx.lineTo(-r*.55,r*.1); ctx.fill();
  }
  ctx.restore();
}
function drawTargets() {
  state.targets.forEach(t => { if (!t.hit || t.falling) drawBird(t.x,t.y,t.r,t.wingPhase,t.falling,t.vx>=0?1:-1); });
}

// ─── DRAW: Particles ──────────────────────────────────────────
function drawParticles() {
  state.particles.forEach(p => {
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=p.decay;
    ctx.save(); ctx.globalAlpha=Math.max(0,p.life);
    if (p.isShard) {
      p.angle=(p.angle||0)+(p.spin||0);
      ctx.translate(p.x,p.y); ctx.rotate(p.angle);
      ctx.fillStyle=p.color; ctx.fillRect(-p.r,-p.r*.35,p.r*2,p.r*.7);
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.color; ctx.fill();
    }
    ctx.restore();
  });
  state.particles = state.particles.filter(p=>p.life>0);
}
function drawHitTexts() {
  state.hit_texts.forEach(t => {
    ctx.save(); ctx.globalAlpha=t.life;
    ctx.font=`bold ${t.size}px 'Cinzel',serif`; ctx.fillStyle=t.color;
    ctx.textAlign='center'; ctx.shadowColor=t.color; ctx.shadowBlur=10;
    ctx.fillText(t.text,t.x,t.y); ctx.restore();
    t.y-=1.2; t.life-=0.02;
  });
  state.hit_texts=state.hit_texts.filter(t=>t.life>0);
}

// ─── DRAW: Wind ───────────────────────────────────────────────
function drawWindIndicator() {
  if (state.phase!=='playing' || state.mode!=='single') return;
  const wStr=Math.abs(state.wind), wDir=state.wind>0?1:-1, cx=W/2, cy=28;
  ctx.save(); ctx.font='9px Cinzel'; ctx.fillStyle='rgba(201,168,76,.5)'; ctx.textAlign='center';
  ctx.fillText('WIND',cx,cy-8);
  if (wStr<0.005) { ctx.fillText('CALM',cx,cy+8); }
  else {
    const str=Math.min(wStr*500,40);
    for (let i=0;i<3;i++){
      const a=(1-i*.3)*.6;
      ctx.strokeStyle=`rgba(201,168,76,${a})`; ctx.lineWidth=1.5-i*.4;
      ctx.beginPath();
      ctx.moveTo(cx+wDir*i*6,cy+4); ctx.lineTo(cx+wDir*(i*6+str),cy+4);
      ctx.lineTo(cx+wDir*(i*6+str-4*wDir),cy); ctx.moveTo(cx+wDir*(i*6+str),cy+4);
      ctx.lineTo(cx+wDir*(i*6+str-4*wDir),cy+8); ctx.stroke();
    }
  }
  ctx.restore();
}

// ─── DRAW: Two-player HUD (health bars on canvas) ─────────────
function drawTwoPlayerHUD() {
  if (state.mode !== 'two') return;
  const barW=180, barH=18, pad=16, top=14;

  // P1 health bar (left)
  ctx.save();
  ctx.font='bold 11px Cinzel'; ctx.letterSpacing='0.15em';
  ctx.fillStyle='rgba(201,168,76,.8)'; ctx.textAlign='left';
  ctx.fillText('P1', pad, top+13);
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.fillRect(pad+28, top, barW, barH);
  const p1frac = Math.max(0,(HITS_TO_LOSE-state.p1Hits)/HITS_TO_LOSE);
  const p1grad = ctx.createLinearGradient(pad+28,0,pad+28+barW,0);
  p1grad.addColorStop(0,'#4a9a4a'); p1grad.addColorStop(0.6,'#c9a84c'); p1grad.addColorStop(1,'#8b1a1a');
  ctx.fillStyle=p1grad;
  ctx.fillRect(pad+28, top, barW*p1frac, barH);
  ctx.strokeStyle='rgba(201,168,76,.4)'; ctx.lineWidth=1;
  ctx.strokeRect(pad+28, top, barW, barH);
  ctx.fillStyle='rgba(255,255,255,.8)'; ctx.textAlign='center';
  ctx.fillText(`${HITS_TO_LOSE-state.p1Hits}/${HITS_TO_LOSE}`, pad+28+barW/2, top+13);

  // P2 health bar (right)
  const rx = W-pad-28-barW;
  ctx.fillStyle='rgba(100,180,255,.8)'; ctx.textAlign='right';
  ctx.fillText('P2', W-pad, top+13);
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.fillRect(rx, top, barW, barH);
  const p2frac = Math.max(0,(HITS_TO_LOSE-state.p2Hits)/HITS_TO_LOSE);
  const p2grad = ctx.createLinearGradient(rx,0,rx+barW,0);
  p2grad.addColorStop(0,'#4a4a9a'); p2grad.addColorStop(0.6,'#4c9ac9'); p2grad.addColorStop(1,'#1a3a8b');
  ctx.fillStyle=p2grad;
  ctx.fillRect(rx+(1-p2frac)*barW, top, barW*p2frac, barH);
  ctx.strokeStyle='rgba(100,180,255,.4)'; ctx.lineWidth=1;
  ctx.strokeRect(rx, top, barW, barH);
  ctx.fillStyle='rgba(255,255,255,.8)'; ctx.textAlign='center';
  ctx.fillText(`${HITS_TO_LOSE-state.p2Hits}/${HITS_TO_LOSE}`, rx+barW/2, top+13);

  // Controls reminder
  ctx.fillStyle='rgba(201,168,76,.35)'; ctx.font='10px Crimson Pro,serif';
  ctx.textAlign='left'; ctx.fillText('P1: W/S climb · Mouse aim+shoot', pad, H-8);
  ctx.textAlign='right'; ctx.fillText('P2: I/K climb · J/L aim · U hold+release', W-pad, H-8);
  ctx.restore();
}

// ─── Burst particles ──────────────────────────────────────────
function spawnBurst(x, y, color) {
  for (let i=0;i<14;i++){
    const angle=(Math.PI*2/14)*i+Math.random()*.4, spd=2.5+Math.random()*4;
    state.particles.push({ x,y, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd-1.5, r:4+Math.random()*5, life:1, decay:.018, color, isShard:true, angle:Math.random()*Math.PI*2, spin:(Math.random()-.5)*.3 });
  }
  for (let i=0;i<8;i++){
    const angle=Math.random()*Math.PI*2, spd=1+Math.random()*2;
    state.particles.push({ x,y, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd-.5, r:6+Math.random()*8, life:1, decay:.06, color:'#fff' });
  }
}
function spawnHitFlash(x, y) {
  for (let i=0;i<12;i++){
    const angle=(Math.PI*2/12)*i, spd=1.5+Math.random()*3;
    state.particles.push({ x,y, vx:Math.cos(angle)*spd, vy:Math.sin(angle)*spd-1, r:3+Math.random()*4, life:1, decay:.03, color:'#ff4444' });
  }
  for (let i=0;i<5;i++){
    state.particles.push({ x:x+(Math.random()-.5)*20, y, vx:(Math.random()-.5)*2, vy:-2-Math.random()*2, r:2+Math.random()*3, life:1, decay:.02, color:'#ff9900' });
  }
}

// ─── Physics ──────────────────────────────────────────────────
function updateArrows() {
  for (let ai = state.arrows_in_flight.length-1; ai>=0; ai--) {
    const a = state.arrows_in_flight[ai];
    a.x+=a.vx; a.y+=a.vy; a.vy+=GRAVITY; a.vx+=state.wind;
    a.age=(a.age||0)+1;

    if (a.y >= GROUND_Y-4) {
      stuckArrows.push({x:a.x, y:GROUND_Y-4, angle:Math.atan2(a.vy,a.vx)});
      state.arrows_in_flight.splice(ai,1);
      if (state.mode==='single') checkAfterShot();
      continue;
    }
    if (a.x>W+100||a.x<-100||a.age>700) {
      state.arrows_in_flight.splice(ai,1);
      if (state.mode==='single') checkAfterShot();
      continue;
    }

    if (state.mode==='single') {
      // Bird collision — pass through
      for (let ti=0;ti<state.targets.length;ti++){
        const t=state.targets[ti];
        if (t.hit) continue;
        if (Math.hypot(a.x-t.x,a.y-t.y)<t.r*1.1){
          t.hit=true; t.falling=true; t.fallVy=-1; t.vx*=0.3;
          const pts=30*Math.max(1,state.level); state.score+=pts;
          spawnBurst(t.x,t.y,'#c8a050');
          state.hit_texts.push({x:t.x,y:t.y-20,text:'HIT!',life:1,size:20,color:'#ffd700'});
          state.hit_texts.push({x:t.x,y:t.y-38,text:`+${pts}`,life:1,size:13,color:'#ffd700'});
          document.getElementById('score-num').textContent=state.score;
          checkAfterShot();
        }
      }
    } else {
      // Two-player: hit opposing archer
      if (a.owner==='p1') {
        // Check if hits P2
        const p2x=ARCHER2_X, p2y=state.p2Y;
        if (Math.abs(a.x-p2x)<20 && Math.abs(a.y-p2y)<30){
          state.arrows_in_flight.splice(ai,1);
          state.p2Hits++;
          spawnHitFlash(p2x,p2y);
          state.hit_texts.push({x:p2x,y:p2y-40,text:'OUCH!',life:1,size:22,color:'#ff4444'});
          if (state.p2Hits>=HITS_TO_LOSE) { setTimeout(()=>endTwoPlayer('P1'),600); }
          continue;
        }
      } else {
        // P2 arrow hits P1
        const p1x=ARCHER_X, p1y=state.archerY;
        if (Math.abs(a.x-p1x)<20 && Math.abs(a.y-p1y)<30){
          state.arrows_in_flight.splice(ai,1);
          state.p1Hits++;
          spawnHitFlash(p1x,p1y);
          state.hit_texts.push({x:p1x,y:p1y-40,text:'OUCH!',life:1,size:22,color:'#ff4444'});
          if (state.p1Hits>=HITS_TO_LOSE) { setTimeout(()=>endTwoPlayer('P2'),600); }
          continue;
        }
      }
    }
  }
}

function updateBirds() {
  state.targets.forEach(t=>{
    t.wingPhase+=0.12;
    if (t.falling){ t.fallVy+=GRAVITY*1.2; t.y+=t.fallVy; t.x+=t.vx; t.wingPhase+=0.25; }
    else {
      t.x+=t.vx;
      if (t.x>W-40){ t.x=W-40; t.vx*=-1; }
      if (t.x<150) { t.x=150;  t.vx*=-1; }
      t.y+=Math.sin(t.wingPhase*.3)*.4;
      t.y=Math.max(30,Math.min(GROUND_Y-60,t.y));
    }
  });
}

// ─── Single player flow ───────────────────────────────────────
function checkAfterShot() {
  setTimeout(()=>{
    const allHit = state.targets.every(t=>t.hit);
    const noArrows = state.arrows<=0 && state.arrows_in_flight.length===0;
    if (allHit) setTimeout(()=>nextLevel(),1200);
    else if (noArrows) setTimeout(()=>gameOver(),800);
  },100);
}
function nextLevel() {
  state.level++;
  showOverlay(`
    <h2>LEVEL CLEAR</h2><div class="divider"></div>
    <p>Score: ${state.score}</p>
    <button class="btn" id="ol-btn">NEXT LEVEL</button>
  `, ()=>{ startSingleLevel(); });
}
function gameOver() {
  showOverlay(`
    <h2>FALLEN</h2><div class="divider"></div>
    <p>The forest claims your arrows</p>
    <div class="final-score">SCORE: ${state.score}</div>
    <button class="btn" id="ol-btn">TRY AGAIN</button>
  `, ()=>{ startSingle(); });
}

// ─── Two-player flow ──────────────────────────────────────────
function endTwoPlayer(winner) {
  state.phase='gameover';
  const color = winner==='P1' ? '#c9a84c' : '#4c9ac9';
  showOverlay(`
    <h2 style="color:${color}">${winner} WINS</h2><div class="divider"></div>
    <p>The duel is over</p>
    <div class="final-score" style="color:${color}">${winner} VICTORIOUS</div>
    <div class="mode-btns">
      <button class="btn" id="ol-btn">REMATCH</button>
      <button class="btn" id="ol-menu-btn">MENU</button>
    </div>
  `, ()=>{ startTwo(); });
}

// ─── Overlay helper ───────────────────────────────────────────
function showOverlay(html, primaryCb) {
  const ov = document.getElementById('overlay');
  ov.innerHTML = html; ov.style.display='flex';
  const btn = document.getElementById('ol-btn');
  if (btn) btn.onclick = ()=>{ ov.style.display='none'; primaryCb(); };
  const mbtn = document.getElementById('ol-menu-btn');
  if (mbtn) mbtn.onclick = ()=>{ ov.style.display='none'; showMenu(); };
}
function showMenu() {
  state.mode='menu'; state.phase='menu';
  document.getElementById('level-display').style.display='none';
  document.getElementById('arrows-display').style.display='';
  document.getElementById('p2-power-container').style.display='none';
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <h2>ARCHER</h2><div class="divider"></div>
    <p>Forest of Trials</p>
    <p style="font-size:13px;margin-top:4px;">Hold mouse to draw bow · Release to fire · W/S to climb</p>
    <div class="mode-btns">
      <button class="btn" id="btn-single">SINGLE PLAYER</button>
      <button class="btn blue" id="btn-two">TWO PLAYERS</button>
    </div>`;
  ov.style.display='flex';
  document.getElementById('btn-single').onclick=startSingle;
  document.getElementById('btn-two').onclick=startTwo;
}

// ─── Start modes ──────────────────────────────────────────────
function startSingle() {
  state.mode='single'; state.score=0; state.level=1;
  stuckArrows.length=0; state.particles=[]; state.hit_texts=[]; state.arrows_in_flight=[];
  document.getElementById('score-num').textContent='0';
  document.getElementById('level-display').style.display='';
  document.getElementById('arrows-display').style.display='';
  document.getElementById('p2-power-container').style.display='none';
  document.getElementById('instructions').textContent='W/S ↑↓ climb · Hold+aim+release to shoot';
  document.getElementById('overlay').style.display='none';
  startSingleLevel();
}
function startSingleLevel() {
  const cfg=getLevelConfig(state.level);
  state.arrows=cfg.arrowsGiven; state.phase='playing';
  state.archerY=LADDER_BOTTOM-10; state.climbDir=0;
  stuckArrows.length=0; state.arrows_in_flight=[];
  spawnTargets();
  document.getElementById('arrows-left').textContent=state.arrows;
  document.getElementById('lvl-num').textContent=state.level;
}

function startTwo() {
  state.mode='two'; state.phase='playing';
  state.p1Hits=0; state.p2Hits=0;
  state.archerY=LADDER_BOTTOM-10; state.climbDir=0;
  state.p2Y=LADDER_BOTTOM-10; state.p2ClimbDir=0;
  state.p2Holding=false; state.p2Power=0; state.p2AimAngle=Math.PI; state.p2AimDir=0;
  state.holding=false; state.power=0;
  stuckArrows.length=0; state.particles=[]; state.hit_texts=[]; state.arrows_in_flight=[]; state.targets=[];
  state.wind=0;
  document.getElementById('level-display').style.display='none';
  document.getElementById('arrows-display').style.display='none';
  document.getElementById('p2-power-container').style.display='flex';
  document.getElementById('instructions').textContent='P1: W/S climb · Mouse aim+shoot  |  P2: I/K climb · J/L aim · U hold+release to shoot';
  document.getElementById('overlay').style.display='none';
}

// ─── Power bar update ─────────────────────────────────────────
function updatePowerBar() {
  if (state.holding && state.phase==='playing') {
    state.power=Math.min((Date.now()-state.holdStart)/HOLD_MAX*MAX_POWER,MAX_POWER);
    document.getElementById('power-bar').style.width=(state.power/MAX_POWER*100)+'%';
  } else { document.getElementById('power-bar').style.width='0%'; }
  if (state.mode==='two') {
    if (state.p2Holding && state.phase==='playing') {
      state.p2Power=Math.min((Date.now()-state.p2HoldStart)/HOLD_MAX*MAX_POWER,MAX_POWER);
      document.getElementById('p2-power-bar').style.width=(state.p2Power/MAX_POWER*100)+'%';
    } else { document.getElementById('p2-power-bar').style.width='0%'; }
  }
}

// ─── Input ────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e=>{
  const r=canvas.getBoundingClientRect();
  const scaleX=W/r.width, scaleY=H/r.height;
  state.mouseX=(e.clientX-r.left)*scaleX;
  state.mouseY=(e.clientY-r.top)*scaleY;
});

// P1 shoot — left mouse button
canvas.addEventListener('mousedown', e=>{
  if (e.button!==0 || state.phase!=='playing') return;
  state.holding=true; state.holdStart=Date.now();
});
canvas.addEventListener('mouseup', e=>{
  if (e.button!==0 || !state.holding || state.phase!=='playing') return;
  state.holding=false;
  if (state.power<0.5){ state.power=0; return; }
  const angle=Math.atan2(state.mouseY-state.archerY, state.mouseX-ARCHER_X);
  state.arrows_in_flight.push({ x:ARCHER_X+30*Math.cos(angle), y:state.archerY-8+30*Math.sin(angle), vx:state.power*Math.cos(angle), vy:state.power*Math.sin(angle), owner:'p1' });
  if (state.mode==='single'){ state.arrows--; document.getElementById('arrows-left').textContent=state.arrows; }
  state.power=0;
});

// Keys
const keys={};
document.addEventListener('keydown', e=>{
  if (state.phase!=='playing') return;
  keys[e.code]=true;
  // P1 climb
  if (e.code==='ArrowUp'||e.code==='KeyW')   state.climbDir=-1;
  if (e.code==='ArrowDown'||e.code==='KeyS') state.climbDir=1;
  // P2 climb
  if (e.code==='KeyI') state.p2ClimbDir=-1;
  if (e.code==='KeyK') state.p2ClimbDir=1;
  // P2 aim up/down
  if (e.code==='KeyJ') state.p2AimDir=-1;
  if (e.code==='KeyL') state.p2AimDir=1;
  // P2 draw bow
  if (e.code==='KeyU' && state.mode==='two' && !state.p2Holding) {
    state.p2Holding=true; state.p2HoldStart=Date.now();
  }
});
document.addEventListener('keyup', e=>{
  keys[e.code]=false;
  if (e.code==='ArrowUp'||e.code==='KeyW'||e.code==='ArrowDown'||e.code==='KeyS') state.climbDir=0;
  if (e.code==='KeyI'||e.code==='KeyK') state.p2ClimbDir=0;
  if (e.code==='KeyJ'||e.code==='KeyL') state.p2AimDir=0;
  // P2 release — fire at current aim angle
  if (e.code==='KeyU' && state.mode==='two' && state.p2Holding) {
    state.p2Holding=false;
    if (state.p2Power<0.5){ state.p2Power=0; return; }
    const angle = state.p2AimAngle;
    state.arrows_in_flight.push({ x:ARCHER2_X+30*Math.cos(angle), y:state.p2Y-8+30*Math.sin(angle), vx:state.p2Power*Math.cos(angle), vy:state.p2Power*Math.sin(angle), owner:'p2' });
    state.p2Power=0;
  }
});

// ─── Main loop ────────────────────────────────────────────────
let lastTime=0;
function loop(ts) {
  requestAnimationFrame(loop);
  lastTime=ts;

  if (state.phase==='playing') state.bg_offset+=0.3;

  ctx.clearRect(0,0,W,H);
  drawBackground();

  // Draw ladders
  drawLadder(ARCHER_X-2, false);
  if (state.mode==='two') drawLadder(ARCHER2_X+2, true);

  drawStuckArrows();
  drawTargets();

  // Draw P1
  const p1angle = Math.atan2(state.mouseY-state.archerY, state.mouseX-ARCHER_X);
  drawArcher(ARCHER_X, state.archerY, p1angle, state.holding, state.power, false);

  // Draw P2 (two-player only)
  if (state.mode==='two') {
    // P2 aims toward P1 — manual aim with J/L keys
    if (state.p2AimDir!==0)
      state.p2AimAngle = Math.max(-Math.PI, Math.min(0, state.p2AimAngle + state.p2AimDir*0.03));
    const p2angle = state.p2AimAngle;
    drawArcher(ARCHER2_X, state.p2Y, p2angle, state.p2Holding, state.p2Power, true);
  }

  drawArrows();
  drawParticles();
  drawHitTexts();
  drawWindIndicator();
  drawTwoPlayerHUD();

  if (state.phase==='playing') {
    updateArrows();
    updatePowerBar();
    // P1 climb
    if (state.climbDir!==0)
      state.archerY=Math.max(LADDER_TOP+10,Math.min(LADDER_BOTTOM-10,state.archerY+state.climbDir*CLIMB_SPEED));
    // P2 climb
    if (state.mode==='two' && state.p2ClimbDir!==0)
      state.p2Y=Math.max(LADDER_TOP+10,Math.min(LADDER_BOTTOM-10,state.p2Y+state.p2ClimbDir*CLIMB_SPEED));
    // Update P2 power bar
    if (state.mode==='two' && state.p2Holding)
      state.p2Power=Math.min((Date.now()-state.p2HoldStart)/HOLD_MAX*MAX_POWER,MAX_POWER);
    // Birds
    if (state.mode==='single') updateBirds();
  }
}

// ─── Init ─────────────────────────────────────────────────────
resizeCanvas();
initBgLayers();
document.getElementById('btn-single').onclick=startSingle;
document.getElementById('btn-two').onclick=startTwo;
requestAnimationFrame(loop);
</script>
